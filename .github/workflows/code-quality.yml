name: Code Quality

on:
  push:
    # DEFAULT BRANCHES ONLY. `pull_request` below carries every other branch.
    #
    # This was an allow-list of branch prefixes, and that was a gate with a
    # SILENT hole: a branch matching nothing got no CI at all, and its last
    # visible status was whatever it inherited — indistinguishable, on every
    # dashboard, from a branch that passed. Two live examples, both found
    # 2026-08-14: `perf/**` was uncovered in openconnector, where a merge
    # carrying unresolved conflict markers and 84 failing tests was pushed and
    # nothing ran; and `feat/**` was uncovered in openregister, because the
    # list said `feature/**`.
    #
    # The comment that stood here said adding prefixes was not the durable fix,
    # and that the durable fix was to let the pull_request trigger gate it.
    # THIS IS THAT CHANGE.
    #
    # What forced it now: a push to a branch with an open PR ran the SAME 34
    # jobs TWICE on the same commit. `concurrency` cannot dedupe them — the
    # group is suffixed by event name deliberately (.github#540: a
    # default-branch push carries jobs a PR run does not, and a dispatch must
    # not be cancellable by a standing release PR), so the two events sit in
    # different lanes BY DESIGN and both run to completion. Measured fleet-wide
    # 2026-08-25..27, 659 of 2,106 Code Quality runs were that duplicate — 31%
    # of the fleet's most expensive workflow, re-deciding a commit another run
    # was already deciding. The account ceiling is 60 concurrent jobs (Team
    # plan); the fleet was measured at 53 running with 1,528 jobs queued behind
    # them, the oldest run 7 hours old and not yet started.
    #
    # NO BRANCH LOSES ITS FLOOR. merge-hygiene.yml runs on `'**'` — every
    # branch anyone pushes, no prefix list to forget — and it is the check
    # `development` actually requires. That is the smoke alarm; this workflow
    # is the fire brigade and belongs on the PR. Of 668 feature-branch push
    # runs in that window, only NINE were on a branch with no PR run beside
    # them.
    #
    # The default branches STAY: their push runs are not duplicates, they are
    # the only carrier of Coverage Baseline Check, SBOM and Features Extract,
    # none of which run on a pull_request event.
    branches:
      - main
      - development
  pull_request:
    branches: [main, master, development, beta]
  workflow_dispatch:

jobs:
  quality:
    if: (github.event_name != 'pull_request' || github.head_ref != 'development')
    uses: ConductionNL/.github/.github/workflows/quality.yml@main
    with:
      app-name: buildiq
      php-version: "8.3"
      php-test-versions: '["8.3", "8.4"]'
      # stable31 is REMOVED, not "dropped for coverage". `additional-apps` below
      # installs openregister, which declares min-version="32" and therefore
      # cannot install on NC31 — `occ app:enable openregister` fails with only a
      # ::warning::, so the run continues WITHOUT its data layer and every
      # /apps/openregister/... call returns Nextcloud's HTML 404 page. A stable31
      # leg was testing an impossible configuration, so its red said nothing.
      # Newman, Playwright and journeydoc-capture all pin `fromJSON(...)[0]`, so
      # the FIRST entry has to be a version openregister can load.
      #
      # THE LIST IS THE WHOLE DECLARED RANGE. appinfo/info.xml declares
      # <nextcloud min-version="32" max-version="34"/>, so 32, 33 and 34 each get
      # a leg. Adopting NC 34 by REPLACING the list left 32 and 33 advertised to
      # the App Store with no job touching them — the declared floor became the
      # untested end, which is the same drift as never testing 34, reversed.
      nextcloud-test-refs: '["stable34", "stable32", "stable33"]'
      enable-psalm: true
      enable-phpstan: true
      enable-phpmetrics: true
      enable-frontend: true
      enable-eslint: true
      enable-phpunit: true
      # Run the Hydra mechanical quality gates against this PR's diff.
      #
      # Deliberately no count here: the gate set is the composer package
      # `conduction/hydra-gates` and that package is the single source of truth
      # for which gates exist and how many actually report. A digit written into
      # prose goes stale silently and then misrepresents the coverage this repo
      # has. See https://github.com/ConductionNL/.github/tree/main/hydra-gates
      #
      # Without this, wiring the gates into `composer check:strict` would have
      # been a LOCAL-ONLY change: nothing in this repository's CI runs
      # check:strict — there is no workflow that invokes it — so every PR would
      # have gone green with the gates never having executed. A gate that only
      # runs on a developer's machine is not a gate.
      enable-hydra-gates: true
      # No `hydra-gates-ref` here on purpose. The shared workflow defaults it
      # to @main, and this workflow is itself consumed at @main, so the two
      # sides move together and a gate fix reaches this repo without a commit
      # in this repo. A pin is a silent expiry date: 22 repos sat on v1.0.1 and
      # 16 gates were dead fleet-wide while every one reported PASS (.github#159),
      # and a default flipped at @main later reached those old runners and made
      # them red on gates they had no subject matter for (.github#173).
      # To hold this repo still for a specific reason, set the input explicitly
      # and say why — it is still honoured. To roll back for everyone, revert on
      # ConductionNL/.github main.
      #
      # THIRD CAUSE, and the one that is failing this repo RIGHT NOW
      # (.github#177): quality.yml@main began executing three gate helpers BY
      # NAME — check_spec_anchors.py, check_form_labels.py and
      # check_license_triangle.py — which exist in NO tag before v1.5.0.
      # Verified by DIRECTORY LISTING of each tag, not by per-file lookups:
      # those answered "present" uniformly across v1.0.0..v1.5.0, and the
      # uniformity across independent inputs was the tell that the instrument
      # was wrong. So the Hydra Gates job here fails at "Verify the pinned gates
      # package satisfies this workflow", before a single gate runs, with the
      # workflow's own words: "This is NOT a code-quality finding about your
      # repository." Removing the pin is the repair.
      #
      # Unpinning also picks up v1.5.1's push scoping (.github#179): on a push to
      # `development`, `origin/development` IS `HEAD`, so the diff was empty by
      # construction — <= v1.4.0 passed over it (permanently green) and v1.5.0
      # refused with exit 99 (permanently red). The scope is now
      # `github.event.before...HEAD`, what the push actually changed.
      # `enable-axe` is deliberately still NOT set — a vanilla Nextcloud 34
      # reports serious/critical violations on core's OWN routes that DOM
      # scoping does not remove. Enabling axe is a separate decision.
      # Newman is ON. It has never actually run in this repository: the flag
      # was `false`, which makes the job report `skipped`, and a skipped job is
      # indistinguishable from a passing one in the run summary. Eighteen
      # collections sit in `tests/integration/` having never been executed once
      # by CI.
      #
      # THE SEED COULD NOT FAIL, SO "IT WOULD JUST BE RED" WAS NEVER MEASURED.
      # The shared workflow interpolated `newman-seed-command` into an
      # UNQUOTED `eval` with no status check. This repository is the one caller
      # in the fleet that passes an `&&` chain —
      #   `php occ app:disable buildiq && php occ app:enable buildiq`
      # — so the outer shell split it before `eval` ever saw it, `eval` ran
      # only the `disable`, and bash's `set -e` exemption for `&&` lists
      # returned 0 regardless. Fixed upstream in ConductionNL/.github#212: the
      # seed now reaches `eval` as one quoted unit and its combined status is
      # the step's. A red Newman leg here is therefore a real finding now, and
      # so is a green one.
      #
      # The two blockers this flag used to carry:
      #
      #   1. `SeedHelloWorld failed: Call to undefined function
      #      React\Async\await()` — OpenRegister's runtime-schema-API pulls
      #      `react/async` but it was not surfacing in the CI install.
      #      Re-measured 2026-08-09: `react/async ^4.3` is a `require` in
      #      openregister@development's composer.json AND is present in its
      #      committed composer.lock, so the CI install resolves it.
      #   2. `[PermissionHandler] no such function: REGEXP` from OR's
      #      MagicMapper under SQLite. Dead: `database:` below is now `pgsql`,
      #      and that switch was made for exactly this family of failure (see
      #      the note under `database`). Newman reads the same `database`
      #      input, so it moved to Postgres with everything else.
      #
      # Neither blocker was re-measured after `database: pgsql` landed. This
      # flag makes CI answer the question instead of the comment answering it.
      enable-newman: true
      # Was `sqlite`. Measured on run 31018480923: it is what made the E2E seed
      # fail before a single spec ran —
      #
      #   Failed to seed hello-world fixture: … SQLSTATE[HY000]: General error:
      #   1 no such table: information_schema.columns
      #
      # OpenRegister's MagicTableHandler reads `information_schema.columns` to
      # decide whether an object table needs creating/updating. Postgres and
      # MySQL both ship that view; SQLite does not have it at all. This is the
      # same family as documented Newman blocker #2 below (`no such function:
      # REGEXP`, also from OR's MagicMapper, also SQLite-only) — OpenRegister
      # simply does not run on SQLite, and every job in this file that boots it
      # was running on a database it does not support.
      #
      # `pgsql` is the shared workflow's own default, which is why it did not
      # need writing here at all; the repos whose E2E is green (opencatalogi,
      # doriath) set no `database:` and get it. Stated explicitly rather than
      # deleted so the next person reads the reason instead of re-adding the
      # override. The `database` input also feeds PHPUnit, Newman and the
      # journeydoc capture, so those move to Postgres with it.
      database: pgsql
      # Was `php occ app:disable buildiq && php occ app:enable buildiq`.
      # That command seeded NOTHING and exited 0 while doing it — the exact
      # shape this programme exists to find. Nextcloud runs repair steps on
      # install and upgrade, not on disable/enable of an app that is already
      # installed, so the hello-world fixture was never created; and the
      # dedicated `buildiq:seed-hello-world-fixture` occ command was never
      # invoked at all. Disabling and re-enabling an app genuinely succeeds,
      # so the step was green for a true reason while leaving the instance
      # unseeded.
      #
      # Measured 2026-08-10 by logging the register contents from inside the
      # suite: the three Applications present in CI were `newman-wizard-single`,
      # `newman-wizard-dsp` and `newman-permits` — every one of them created by
      # the collections themselves during the run. There was no `hello-world`.
      # Four collections (versioning, application-versions, rbac, page-editor)
      # open by locating it, so the lookup returned nothing, the
      # `application_uuid` variable stayed empty, and every later URL in those
      # collections interpolated an empty path segment — the `//` and trailing
      # `/` 404s that dominated the failure list.
      #
      # This is the seed Playwright has been using all along
      # (`playwright-seed-command` below is the same script), and it really
      # does the work: ci-seed.sh line ~358 runs
      # `php occ buildiq:seed-hello-world-fixture`. It is `set -euo pipefail`
      # and refuses to run outside CI without an explicit base URL, so it stays
      # able to fail — no `|| true` anywhere in the path.
      # `SEED_REQUIRE_BUNDLE=0` — this job never loads the SPA. It calls the
      # REST API and asserts on JSON, and it does not run the frontend build,
      # so there is no bundle for it to serve. The default in ci-seed.sh is to
      # ENFORCE the bundle gate (Playwright still does, unchanged); this opts
      # out deliberately and the script ANNOUNCES the skip in its output, so a
      # skipped browser check can never read as a passed one. Every API fixture
      # this suite depends on is still seeded and still able to fail.
      newman-seed-command: 'SEED_REQUIRE_BUNDLE=0 bash apps/buildiq/tests/e2e/ci-seed.sh'
      # OpenRegister `development` carries the runtime-schema-API (auto-create
      # Register on application-type imports — OR PR #1464) and the lifecycle
      # engine (ObjectTransitionedEvent) that Buildiq's repair steps + the
      # Newman publish step need; `main` predates both. See buildiq#29.
      #
      # DOCUDESK IS HERE BECAUSE THREE E2E SPECS ASSERT AGAINST ITS API AND
      # THERE WAS NO WAY FOR THEM TO PASS WITHOUT IT.
      #
      # `tests/e2e/spec-coverage/docudesk-document-templates.spec.ts` drives the
      # builder's Documents section: attach a template, preview it, and warn
      # when the attached template was deleted. All three go through Docudesk's
      # own REST surface (`GET/POST /apps/docudesk/api/templates`,
      # `GET /apps/docudesk/api/templates/{id}`,
      # `POST /apps/docudesk/api/templates/{id}/preview`). With Docudesk absent
      # every one of those is a Nextcloud router 404, and the run said so
      # plainly: `[globalSetup] docudesk not installed — template fixtures
      # skipped`, then three failures reading `Expected: 200 / Received: 404`.
      # That is not an app defect and no code change in this repository could
      # have fixed it — the dependency was simply not installed.
      #
      # `tests/e2e/global-setup.ts` already knows what to do once it IS: it
      # configures Docudesk's `template_register`/`template_schema` through
      # Docudesk's own `POST /api/settings` and seeds the two template fixtures
      # the specs attach to, and it degrades to a log line when Docudesk is
      # missing. So this input is the whole fix.
      #
      # `ref: main` — Docudesk has no `development` branch (verified by listing
      # the repo's branches; it publishes `main` and `beta` only), and `main`
      # carries every route above.
      #
      # Only the API is exercised. `additional-apps` clones and runs `composer
      # install` but never builds an app's frontend, so Docudesk's own JS bundle
      # is absent here — which is fine, because no spec in this suite opens a
      # Docudesk page.
      additional-apps: '[{"repo":"ConductionNL/openregister","app":"openregister","ref":"development"},{"repo":"ConductionNL/filinq","app":"filinq","ref":"main"}]'
      enable-sbom: true

      # (Integration Tests (Newman) is enabled at `enable-newman` above; the
      # reasoning, and the re-measurement of the two blockers that used to keep
      # it off, is written there.)

      # ── Frontend Check legs ──────────────────────────────────────────────
      # `frontend-checks` defaults to `[]`, and an empty list means the shared
      # workflow emits NO "Frontend Check" job at all — so these two validators
      # ran nowhere while the run still looked complete. Both are self-contained
      # `node` scripts, which is what a leg has to be.
      # `test:l10n` was measured FAILING on this tree (source strings missing
      # from l10n/en.json, e.g. "Widgets on this page"). `check:manifest` could
      # not be measured locally — it `require`s `ajv/dist/2020`, which only
      # exists after the leg's own `npm ci`, so CI is the first place it gets a
      # real verdict.
      # `test` / `test:unit` are NOT listed: "Frontend Tests (unit)" runs them.
      #
      # `check:gitignore` added 2026-08-08. `.gitignore` carried the scaffold
      # pattern `**/*references*`, a substring glob, which matched
      # lib/Controller/PreferencesController.php and its test. Both were tracked,
      # so nothing complained — but a `git archive`-and-re-add copy of the same
      # commit lost them, and the hydra-gates runner enumerates controllers with
      # `git ls-files`: gate-14 reported 7 findings against the working tree and
      # 5 against that copy. Two numbers for one tree. The check fails if any
      # tracked file under lib/src/appinfo/tests/scripts is matched by an ignore
      # rule, and fails LOUDLY (exit 2) if it enumerated nothing at all.
      #
      # `check:nc-floor` added 2026-08-08 with the 28 -> 32 floor raise. It
      # asserts that every `nextcloud-test-refs` entry above is >= the
      # `<nextcloud min-version>` in appinfo/info.xml, and pins the floor to 32
      # / PHP 8.3. It lives HERE and not in PHPUnit on purpose: the PHPUnit job
      # runs against a DEPLOYED copy of the app under `server/apps/buildiq`,
      # which is not the repository — `.github/workflows/` is not part of it.
      # A first attempt at this invariant as a PHPUnit test went red on all four
      # legs for exactly that reason.
      #
      # `format` (prettier --check) is listed because the shared workflow has NO
      # prettier job of its own — `quality.yml` runs eslint and stylelint and
      # mentions prettier ZERO times. This repo already carries
      # `@nextcloud/prettier-config` and a `format` script, so without this leg
      # `npm run format` never runs outside a developer's editor and the tree
      # drifts straight back out of format between merges — the same inert-
      # formatter failure mode that made the old `.prettierrc` worth deleting.
      # Centralising the config never stopped drift; the gate does.
      # Measured on this tree before enabling: PASSES, 429 of 441 tracked
      # frontend files in scope (docs/ excluded via .prettierignore; build
      # output via .gitignore, which prettier 3 also reads).
      # `check:l10n-js` regenerates l10n/<locale>.js from the JSON catalogue and
      # fails when the committed file is stale. Nextcloud serves ONLY the JS half
      # to a browser — raw JSON out of an app directory is a 404 — so a catalogue
      # that exists only as JSON renders English in the entire UI while every
      # server-rendered string is translated, with no error anywhere.
      # `check:schema-l10n` is a RATCHET, not a gate. Every string inside a form
      # comes from the schema and is a key in THIS app's catalogue; an absent key
      # renders the English source inside an otherwise translated form, silently.
      # The fleet had 30,459 such strings, so this records the current count and
      # fails only when it GROWS — burning it down stays an ordinary PR.
      frontend-checks: '["check:manifest", "test:l10n", "check:gitignore", "check:nc-floor", "format", "check:l10n-js", "check:schema-l10n"]'

      # ── Coverage ratchet ─────────────────────────────────────────────────
      # `enable-coverage-guard` defaults to FALSE, which is why both
      # "Coverage Baseline Protection" and "Coverage Baseline Check" have only
      # ever reported `skipped`. It needs two inputs this repo did not have,
      # both added in this commit: `scripts/coverage-guard.php` (byte-identical
      # to openregister's) and `.coverage-baseline` = 57.39, this repo's own
      # measured coverage (8018 of 13971 statements) read from clover.xml in the
      # `coverage-report` artifact of run 30911188960.
      enable-coverage-guard: true

      # ── E2E Tests (Playwright) ───────────────────────────────────────────
      # `enable-playwright` defaults to FALSE and this file never set it, so
      # the shared workflow's `E2E Tests (Playwright)` job has reported
      # `skipped` on every run this repository has ever produced — while 50
      # committed spec files sat in `tests/e2e/`. Unlike `enable-newman: false`
      # above, that was not a decision anyone recorded; it is simply a default
      # nobody chose, and a skipped job is indistinguishable from a passing one
      # in the run summary. Turning it on is the whole point of this change.
      #
      # `playwright-test-path` is NOT cosmetic here. The workflow picks its
      # config as `"${playwright-test-path}/playwright.config.ts"`, falling
      # back to the ROOT `playwright.config.ts`, and then runs it with NO
      # `--project` — so every project in whichever config it lands on runs.
      # The root config declares three, and two of them are documented as
      # unable to pass on a CI runner: `docs-capture` (journeydoc; the separate
      # `Journeydoc Capture` job owns it) and `visual` (PNG baselines that,
      # per that config's own header, "a CI Linux runner will not byte-match").
      # Pointing at `tests/e2e` makes the FIRST lookup hit
      # `tests/e2e/playwright.config.ts`, added in this commit, which declares
      # only the `chromium` regression project and writes its report/traces to
      # the app root — the paths the workflow's upload steps actually look at.
      # The root config is untouched and still drives local runs.
      #
      # OpenRegister is already checked out for every job via `additional-apps`
      # above, which the specs need: Buildiq's applications, versions and
      # schemas are OpenRegister objects.
      enable-playwright: true
      playwright-test-path: tests/e2e

      # The instance setup the suite cannot do for itself on CI.
      # `tests/e2e/global-setup.ts` does it locally, but it reaches `occ` by
      # resolving the DOCKER CONTAINER publishing the port under test — and it
      # deliberately refuses to guess when it cannot resolve one (guessing is
      # how it used to seed a different instance than it asserted against).
      # On this runner Nextcloud is `php -S`, not a container, so those steps
      # log a warning and no-op. `tests/e2e/ci-seed.sh` is the documented
      # override path; the step runs with cwd = the Nextcloud server root, so
      # the app-relative path below is what `occ` sees.
      #
      # It was a two-command inline string until run 31030663352 measured what
      # that leaves undone. Read the script's header for the full reasoning; the
      # short version is five things, each of which fails SILENTLY:
      #
      #   1. htaccess.IgnoreFrontController=true. THE root cause of the first
      #      run's failures. buildiq builds its router as
      #      `createWebHistory(generateUrl('/apps/buildiq'))`, and
      #      `generateUrl()` prefixes `/index.php` unless the page reports
      #      `modRewriteWorking`. A freshly `maintenance:install`ed instance
      #      does not set it, so the router base becomes
      #      `/index.php/apps/buildiq` while every spec navigates to the
      #      pretty `/apps/buildiq/...`. Those disagree, vue-router matches
      #      nothing, and the SPA mounts and renders perfectly — on the
      #      DASHBOARD. No 404, no console error. That is why 68 of the 83
      #      tests the first run reached failed on a non-Dashboard selector
      #      (`.agents-page`, `.ob-app-card`, `.automations-page`,
      #      `.page-designer__left`), while the only UI tests that passed were
      #      builder-host's first two — whose inner router is based at
      #      `/apps/buildiq/builder/<slug>`, the exact URL the spec opens, so
      #      its DEFAULT route is the page being asserted. builder-host's third
      #      test, the one that needs the `/messages/new` SUB-path to survive,
      #      failed with the rest. The CI router already serves pretty URLs
      #      (the workflow's own front-controller check proves it), so this
      #      states something TRUE about the instance rather than working
      #      around anything.
      #   2. The register + schema import. `occ app:enable buildiq` runs
      #      `InitializeSettings`, which imports with NO user session — so OR's
      #      RBAC denies it and the repair step downgrades the throw to a
      #      warning. Done here explicitly over the admin HTTP API, FORCED,
      #      and then VERIFIED against the 15 schema slugs read out of the repo.
      #   3. ratelimit.protection.enabled=false — the app-creation wizard
      #      carries `#[UserRateLimit(limit: 10, period: 3600)]`, and the suite
      #      creates far more than ten apps (every `ensureApp()` in
      #      tests/e2e/support/appFixture.ts goes through that endpoint). Past
      #      the tenth create every later spec fails on a 429 that has nothing
      #      to do with what it asserts. The limit is correct product behaviour
      #      and is NOT changed — it is switched off for this throwaway test
      #      instance using Nextcloud's own supported flag.
      #   4. buildiq:seed-hello-world-fixture — the deterministic
      #      `hello-world` virtual app the legacy specs assert against.
      #      Production no longer seeds it (the SeedHelloWorld repair step was
      #      retired with the versioned-model migration), so the harness seeds
      #      it. Idempotent; a test/dev-only occ command. Its exit code covers
      #      "already present", so the script also proves the fixture exists
      #      over HTTP.
      #   5. The bundle. A missing frontend bundle does not 404 on Nextcloud —
      #      it serves the HTML error page with HTTP 200 and `text/html`, which
      #      every status-code check in the pipeline reads as success. Gated on
      #      the SERVED response's content type actually being JavaScript.
      #
      # Deliberately NOT `|| true`: if the instance cannot be provisioned, the
      # specs fail on missing content and the cause is a wall of selector
      # timeouts. Better to fail here, once, where the reason is printed.
      playwright-seed-command: 'bash apps/buildiq/tests/e2e/ci-seed.sh'
      # ── Cost controls (see ConductionNL/.github#596, #599) ───────────────
      # Run PHPUnit and Playwright only when the diff could change their
      # verdict. Fails safe TOWARDS running: an unreadable diff, a force-push,
      # a branch creation or a dispatch all run everything, and a filtered
      # skip is a declared state in the Quality Report, not a missing one.
      enable-path-filtering: true
      # PR-time PHPUnit runs the primary PHP against the newest declared
      # Nextcloud; the full matrix still runs on every push to a default
      # branch and on the release PR into beta. Breadth moves from
      # per-commit to per-merge, it is not dropped.
      reduce-pr-matrix: true
